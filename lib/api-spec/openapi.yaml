openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: transcriptions
    description: Audio transcription operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /transcriptions:
    get:
      operationId: listTranscriptions
      tags: [transcriptions]
      summary: List all transcriptions
      description: Returns all transcriptions ordered by creation date
      responses:
        "200":
          description: List of transcriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transcription"
    post:
      operationId: createTranscription
      tags: [transcriptions]
      summary: Upload and transcribe an audio file
      description: Accepts an audio file upload and returns the transcription
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AudioTranscriptionInput"
      responses:
        "201":
          description: Transcription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcription"
        "400":
          description: Invalid file or request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A verified recording is already processing in the batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /transcription-batches/{batchId}/combined:
    get:
      operationId: getCombinedTranscript
      tags: [transcriptions]
      summary: Combine passed verified recordings in a batch
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Combined verified transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CombinedTranscript"
        "404":
          description: No completed, passed verified recordings exist in the batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /transcriptions/text:
    post:
      operationId: importTranscriptionText
      tags: [transcriptions]
      summary: Import a completed transcript without audio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptTextInput"
      responses:
        "201":
          description: Transcript imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcription"
        "400":
          description: Invalid transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /transcriptions/{id}/coherence-jobs:
    post:
      operationId: createCoherenceJob
      tags: [transcriptions]
      summary: Start transcript perfection or transcript-to-play processing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoherenceJobInput"
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoherenceJob"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Transcription not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listCoherenceJobs
      tags: [transcriptions]
      summary: List coherence jobs for a transcription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Coherence jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoherenceJob"
  /coherence-jobs/{id}:
    get:
      operationId: getCoherenceJob
      tags: [transcriptions]
      summary: Poll a coherence job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Coherence job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoherenceJob"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /transcriptions/{id}:
    get:
      operationId: getTranscription
      tags: [transcriptions]
      summary: Get a single transcription
      description: Returns a transcription by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Transcription found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcription"
        "404":
          description: Transcription not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTranscription
      tags: [transcriptions]
      summary: Delete a transcription
      description: Deletes a transcription by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Transcription deleted
        "404":
          description: Transcription not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /transcriptions/{id}/audio:
    get:
      operationId: getTranscriptionAudio
      tags: [transcriptions]
      summary: Stream the original audio for a transcription
      description: |
        Streams the original uploaded/recorded audio that was persisted for
        this transcription. Supports HTTP Range requests for seeking.
        Returns 404 when no audio was stored for the transcription.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Full audio stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial audio stream (range request)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Transcription or audio not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /transcriptions/{id}/transform:
    post:
      operationId: transformTranscription
      tags: [transcriptions]
      summary: Clean up, speaker-format, or rewrite a transcription with an LLM
      description: |
        Runs the completed transcription text through a chosen LLM provider.
        Modes:
          - `cleanup`: removes filler words ("um", "uh"), false starts and
            repetitions, lightly fixes grammar while preserving meaning.
          - `speakers`: formats the transcript into readable dialogue with
            consistent Speaker 1, Speaker 2, etc. labels without inventing names.
          - `rewrite`: rewrites the transcript according to the user's
            free-form instructions.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransformRequest"
      responses:
        "200":
          description: Transformed text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransformResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Transcription not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /transcriptions/stats:
    get:
      operationId: getTranscriptionStats
      tags: [transcriptions]
      summary: Get transcription statistics
      description: Returns summary statistics about transcriptions
      responses:
        "200":
          description: Transcription stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionStats"
  /diagnostics/run:
    post:
      operationId: runDiagnostics
      tags: [diagnostics]
      summary: Run end-to-end application diagnostics
      description: Runs live checks for configuration, database, object storage, audio processing, and AI transcription.
      responses:
        "200":
          description: Diagnostic report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticReport"
components:
  schemas:
    AudioTranscriptionInput:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: The audio file to transcribe (MP3, WAV, etc.)
        processingMode:
          type: string
          enum: [segmented, verified]
          default: segmented
        knownTerms:
          type: string
          description: Newline-delimited key terms and optional "heard wrong => confirmed spelling" corrections.
        batchId:
          type: string
          minLength: 1
          description: Required when processingMode is verified. Groups recordings into one sequential verified session.
      required: [file]
    TranscriptTextInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
        filename:
          type: string
          minLength: 1
      required: [text]
    CoherenceJobInput:
      type: object
      properties:
        jobType:
          type: string
          enum: [polish, play]
        manualSpecifications:
          type: string
          default: ""
        targetWordCount:
          type: integer
          minimum: 1
          maximum: 60000
        fidelityMode:
          type: string
          enum: [verbatim, adaptive, fictionalized]
          default: adaptive
      required: [jobType]
    CoherenceJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transcriptionId:
          type: integer
        jobType:
          type: string
          enum: [polish, play]
        fidelityMode:
          type: string
          enum: [verbatim, adaptive, fictionalized]
        status:
          type: string
          enum: [pending, skeleton_extraction, chunk_processing, stitching, complete, failed]
        progress:
          type: integer
        currentChunk:
          type: integer
        totalChunks:
          type: integer
        targetWordCount:
          type: integer
        finalOutput:
          type: ["string", "null"]
        finalWordCount:
          type: ["integer", "null"]
        warnings:
          type: array
          items:
            type: string
        error:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
      required: [id, transcriptionId, jobType, fidelityMode, status, progress, currentChunk, totalChunks, targetWordCount, finalOutput, finalWordCount, warnings, error, createdAt, updatedAt, completedAt]
    DiagnosticCheck:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [passed, failed]
        detail:
          type: string
        durationMs:
          type: integer
      required:
        - name
        - status
        - detail
        - durationMs
    DiagnosticReport:
      type: object
      properties:
        status:
          type: string
          enum: [passed, failed]
        provider:
          type: string
        model:
          type: string
        credentialSource:
          type: string
        generatedAt:
          type: string
          format: date-time
        checks:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticCheck"
      required:
        - status
        - provider
        - model
        - credentialSource
        - generatedAt
        - checks
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Transcription:
      type: object
      properties:
        id:
          type: integer
        filename:
          type: string
        fileSize:
          type: integer
        text:
          type: string
        status:
          type: string
          enum: [processing, completed, failed]
        errorMessage:
          type: ["string", "null"]
        audioPath:
          type: ["string", "null"]
          description: Path to the stored original audio, if persisted. Null when no audio is available for playback.
        processingMode:
          type: string
          enum: [segmented, verified]
        verificationStatus:
          type: ["string", "null"]
          enum: [pending, passed, failed, null]
        verificationRunA:
          type: ["string", "null"]
        verificationRunB:
          type: ["string", "null"]
        verificationWordCountA:
          type: ["integer", "null"]
        verificationWordCountB:
          type: ["integer", "null"]
        verificationVarianceBps:
          type: ["integer", "null"]
          description: Word-count variance in basis points; 100 bps equals 1%.
        knownTerms:
          type: ["string", "null"]
        batchId:
          type: ["string", "null"]
        batchPosition:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - filename
        - fileSize
        - text
        - status
        - errorMessage
        - audioPath
        - processingMode
        - verificationStatus
        - verificationRunA
        - verificationRunB
        - verificationWordCountA
        - verificationWordCountB
        - verificationVarianceBps
        - knownTerms
        - batchId
        - batchPosition
        - createdAt
    CombinedTranscript:
      type: object
      properties:
        filename:
          type: string
        text:
          type: string
        recordingCount:
          type: integer
        totalWordCount:
          type: integer
      required: [filename, text, recordingCount, totalWordCount]
    TranscriptionStats:
      type: object
      properties:
        totalCount:
          type: integer
        completedCount:
          type: integer
        totalFileSize:
          type: integer
      required:
        - totalCount
        - completedCount
        - totalFileSize
    TransformRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [cleanup, speakers, rewrite]
        provider:
          type: string
          enum: [openai, deepseek, anthropic, venice]
        instructions:
          type: string
          description: Required when mode is "rewrite". Free-form rewrite directions.
      required:
        - mode
        - provider
    TransformResponse:
      type: object
      properties:
        text:
          type: string
        mode:
          type: string
          enum: [cleanup, speakers, rewrite]
        provider:
          type: string
          enum: [openai, deepseek, anthropic, venice]
      required:
        - text
        - mode
        - provider
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
